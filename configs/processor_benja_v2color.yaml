# Regeneración de los cachés con la feature de color v2.
# Copia del config de siempre con SOLO dos cambios: version_color: 2
# y rutas de salida nuevas, para no pisar los cachés actuales hasta
# que la re-medición diga que la v2 gana.
# Guía y plan de medición: docs/regenerar_caches_color_v2.md

pipeline: nuevo
modo: full
deteccion:
  modelo: models/weights/best_v4pre.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
  version_color: 2
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 3
  tramo:
    min_ini: 5.0
    dur_seg: 60.0
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/tracking_benja/cache_detecciones_benja_v2color.pkl
  cache_colores: data/tracking_benja/cache_colores_benja_v2color.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/tracking_benja/posiciones_benja_v2color.csv
  salida_meta: data/tracking_benja/posiciones_benja_meta_v2color.json
