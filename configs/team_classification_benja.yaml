# Clasificación de equipos del partido de BENJAMINES (fútbol 7).
#
# NO comparte nada con configs/team_classification.yaml (Villaviciosa,
# F11): las áreas, el eje de profundidad y las dimensiones son distintos.

# ── El campo: de aquí salen las áreas y las dimensiones ──────────────
campo:
  config: configs/campo_benja.yaml # 62x40, marcas F7

# ── DÓNDE ESTÁ LA CÁMARA (lo más importante de este archivo) ─────────
#
# Casi todo el sistema trata la PROFUNDIDAD de forma especial: el color
# solo es señal de cerca, el error de localización crece con la distancia
# y los umbrales se expresan en metros a cámara. Con la cámara en la
# banda (Villaviciosa) la profundidad es el eje ANCHO; aquí la cámara
# está DETRÁS DE LA PORTERÍA x=0, así que la profundidad es el eje LARGO
# y crece con x.
#
# Verificado con data/calibracion_benja/homografia_benja.npy: la parte
# baja de la imagen (lo más cercano) cae en x≈8 m y sube hacia x grande.
#
# ⚠️ Si el eje fuese el equivocado, "quedarse con los recortes cercanos"
# seleccionaría por una coordenada que no mide la distancia, y el fit del
# clasificador colapsaría en un solo equipo (el fallo de julio-2026).
profundidad:
  eje: x
  creciente: true # lejos = x grande (la cámara está en x=0)

# ── Entrenamiento del clasificador de color ──────────────────────────
#
# Umbrales en METROS DESDE LA CÁMARA. Medido sobre la homografía del
# benja, los metros por píxel son 0.021 (x=5), 0.059 (x=15), 0.161
# (x=31), 0.290 (x=45) y 0.444 (x=58): la señal de color sobrevive en el
# primer tercio y poco más.
#
# 25 m es el punto de partida (equivale a ~0.12 m/píxel, comparable a la
# zona donde el color funcionaba en Villaviciosa). Si el log avisa de
# "solo N recortes cercanos", subirlo; si el fit sale desequilibrado,
# bajarlo. Revisa SIEMPRE en el log que los tamaños de A y B queden
# parecidos.
entrenamiento:
  solo_cercanos: true
  umbral_profundidad_m: 25.0
  min_features: 300

# Agregación por identidad: más generoso que el fit (una identidad con
# algún recorte decente vale más que ninguno).
agregacion:
  # ── Etiqueta por OBSERVACIÓN, no por voto de identidad ───────────
  #
  # ACTIVADA SOLO EN EL BENJAMÍN, y hay que decir por qué no es global:
  # NO VIAJA. Medido contra las métricas de producto en las dos patas:
  #
  #   estrategia            benjamín centroide   Villaviciosa centroide
  #   voto por identidad          1,30 m               3,55 m
  #   ventana 1-2 s               0,36 m               3,94 m
  #
  # Aquí divide el error por 3,6; allí lo empeora. La causa está medida:
  # en Villaviciosa el color de cada recorte es mucho menos fiable —los
  # jugadores están a 0,19-0,80 de su prototipo contra 0,27-0,56 aquí—
  # porque media plantilla juega en la mitad lejana. Donde el recorte es
  # señal, decidir por recorte gana; donde es ruido, lo que salva es
  # promediar.
  #
  # Con DOS partidos no se puede derivar un selector automático sin
  # ajustarlo a dos puntos, así que es una decisión por partido.
  #
  # La ventana sale del barrido: 1,0 y 2,0 s empatan (0,36 y 0,37 m) y a
  # partir de 4 s empeora. Se pone 1,5, en medio.
  por_observacion:
    activo: true
    ventana_s: 1.5
    forzar_ab: true
  # Mínimo de observaciones para poder etiquetar 'otro'. Por debajo se
  # fuerza A/B. El prototipo 'otro' es un imán para las medias ruidosas de
  # identidades cortas: con 1, 7, 14 o 16 observaciones la media de color
  # es ruido, y el cajón se traga jugadores reales.
  # Medido en Villaviciosa (19-ago-2026): cobertura 0.619→0.633, accuracy
  # de equipos 0.750→0.804, identidades puras mal clasificadas 7→5, sin
  # tocar IDF1 ni quimeras. Neutro en el benjamín (allí las identidades
  # son largas y ninguna cae por debajo). Adoptado por Alex.
  min_obs_para_otro: 25
  solo_cercanos: true
  # BARRIDO del 16-ago-2026: este dial manda en la accuracy del benjamín
  # y el 35 se quedaba corto. Medido contra el mini-GT (radio del fit
  # fijo en 25, que es lo que manda en Villaviciosa):
  #     agregación 25 → 0,830 · 35 → 0,867 · 45 → 0,883
  # Villaviciosa no se entera: con radio de fit 25, 28 o 30 da cifras
  # IDÉNTICAS (0,559 / 0,453 / 5 quimeras / 0,671).
  umbral_profundidad_m: 45.0

# ── Regla de porteros: áreas DERIVADAS del modelo F7 ─────────────────
#
# `desde_modelo` calcula las áreas del campo (12 m de profundidad, 26 m
# de ancho → x 0-12 y 50-62, y 7-33) en vez de usar números a mano. Los
# del F11 (corte en mx=88.5) no existen en un campo de 62 m.
#
# ⚠️ equipo_mx_alto / equipo_mx_bajo hay que AJUSTARLOS al partido: qué
# equipo defiende cada portería en este tramo. Con la cámara tras la
# portería x=0, "bajo" es la portería cercana a cámara.
porteros:
  # ADOPTADO el 26-ago-2026 (decisión de Alex). Las métricas de producto
  # EMPATAN dígito a dígito con la regla de área en las dos patas, así que
  # no se adopta por mejorar números sino por lo que la de área no puede
  # hacer: abstenerse cuando no hay portero, encontrarlo cuando el color
  # lo manda al cajón 'otro', y no depender de que el área esté bien
  # puesta. Y sobre todo por el caso del id 55: un jugador de campo con
  # 123 observaciones y la mediana dentro del área, hoy SEGUNDO candidato
  # de la regla vieja (al 21 % del ganador) y solo tapado por la
  # exclusividad. Con las identidades fragmentándose en 6 trozos de
  # mediana, el día que el portero se parta en trozos de menos de 123
  # observaciones sale un jugador de campo pintado de portero — y en el
  # benjamín hay 8 candidatos más esperando. Por último hombre el id 55
  # saca 0,00. Ver docs/portero.md.
  #
  # ⚠️ RIESGO CONOCIDO Y ACEPTADO: abstenerse no es gratis. Si la regla se
  # abstiene con un portero presente pero mal seguido, ese portero se
  # queda con su etiqueta de COLOR, que puede ser la del equipo contrario
  # y mover su centroide. Por eso la abstención sale por el log como
  # WARNING: si empieza a pasar en partidos reales hay que enterarse por
  # el log y no por el replay.
  metodo: ultimo_hombre
  activo: true
  desde_modelo: true
  margen_m: 2.0 # holgura: el portero sale a achicar
  equipo_mx_alto: A # equipo que defiende la portería LEJANA (x=62)
  equipo_mx_bajo: B # equipo que defiende la portería CERCANA (x=0)

# ── Regla de staff: dimensiones del modelo (62x40) ───────────────────
#
# Sin `largo`/`ancho` explícitos, los toma del campo de arriba. Marca
# como no-jugador a quien viva fuera del rectángulo.
staff:
  activo: true
  tolerancia_m: 2.0
  min_observaciones: 5
  # ── SEGUNDA TOLERANCIA, para quien además se mueve poco ──────────
  #
  # ADOPTADO el 25-ago-2026 (mejora TODAS las métricas del benjamín sin
  # degradar ninguna, y es EXACTAMENTE neutro en Villaviciosa).
  #
  # El problema: el entrenador del chándal vive a 0,23 m fuera de la
  # banda y mete la mitad de las fugas del sistema. Bajar `tolerancia_m`
  # para cogerlo NO se puede — un jugador real tiene su mediana a 0,22 m
  # fuera de la banda contraria. Un centímetro. Ninguna tolerancia los
  # separa mirando solo la posición.
  #
  # Y la velocidad sola tampoco: el más lento del partido no es el
  # entrenador (0,67 m/s) sino EL PORTERO (0,60 m/s, 526 obs). Una regla
  # de "se mueve poco" a secas se lleva al portero por delante.
  #
  # Las dos juntas sí, porque el portero está DENTRO y el entrenador
  # FUERA. Doctrina de siempre: la velocidad solo se mira en quien ya
  # está fuera de las líneas.
  #
  # Medido en el benjamín (scripts/reglas_fisicas.py):
  #   centroide  1,55 -> 1,27 m (mediana) · 2,40 -> 1,78 (media)
  #              5,97 -> 4,17 m (p90)
  #   anchura    0,93 -> 0,43 m   ·   ocupación 6,7 % -> 5,5 %
  #   observaciones de personas reales perdidas: CERO
  # En Villaviciosa: cifras IDÉNTICAS (no hay a quién coger, y no rompe).
  #
  # El umbral está en una MESETA ancha: 1,0 · 1,5 · 2,0 · 2,5 m/s dan
  # exactamente el mismo resultado, así que no es un filo. El hueco real
  # va del portero (0,60) al jugador de campo más lento (2,06).
  # ⚠️ 0,15 m y no 0: el portero vive SOBRE la línea de fondo, y con 0
  # exacto un centímetro por detrás lo convertía en staff (medido: el
  # centroide del benjamín se iba de 1,27 a 2,04 m, entre 3 y 5 veces lo
  # que la regla gana). 0,15 m sigue cogiendo al entrenador, que está a
  # 0,23 m, y no cambia ninguna cifra.
  # ── ACTUALIZADO el 26-ago-2026: alcanza al ENTRENADOR ────────────
  #
  # La tolerancia pasa a NEGATIVA, y aquí sí significa algo porque la
  # rama lenta usa distancia CON SIGNO: "hasta 1,5 m DENTRO de la línea".
  # Hacía falta porque el entrenador del benjamín vive a 0,04 y 0,84 m
  # dentro de la banda, partido en dos identidades, y ninguna tolerancia
  # positiva podía alcanzarlo.
  #
  # Por qué es seguro, medido en las dos patas: las personas reales nunca
  # acercan su mediana a menos de **3,05 m** (benjamín) ni **6,27 m**
  # (Villaviciosa) de la línea, y las que más se acercan van a 4-7 m/s.
  #
  # LOS DOS BARRIDOS, y los dos tienen meseta:
  #   tolerancia  -1,0 / -1,5 / -2,5 m   -> mismas cifras
  #   velocidad    2,5 / 3,0 m/s          -> mismas cifras
  #                3,5 m/s                -> ROMPE el caché v4 (p90 de
  #                                          4,17 a 5,96: se come a alguien)
  # Se eligen los CENTROS: -1,5 m y 2,75 m/s. El fragmento más rápido del
  # entrenador va a 1,98 m/s y el jugador real más cercano a la línea a
  # 4,1: 2,75 cae en medio.
  #
  # Efecto: benjamín media 1,58 -> 1,55 m y ocupación 4,1 -> 3,9 %;
  # Villaviciosa idéntico. No degrada nada en ninguna pata.
  tolerancia_lento_m: -1.5
  vel_max_lento: 2.75
  # Y 25 observaciones, no 5: juzgar una VELOCIDAD no es juzgar una
  # mediana de posición. Con 5 muestras en medio segundo "se mueve poco"
  # no significa nada.
  min_obs_lento: 25


# ── Extracción de color: igual que en el F11 (no depende del campo) ──
clasificador_color:
  torso_alto: [0.12, 0.45]
  torso_ancho: [0.15, 0.85]
  verde_h: [35, 85]
  verde_s_min: 40
  verde_v_min: 40
  bins_h: 16
  bins_s: 16
  k_clusters: 8
  umbral_min: 0.5
  umbral_max: 1.3
  umbral_paso: 0.05
  semilla: 0
  # Reinicios del KMeans. ADOPTADO el 25-ago-2026: 10 era el canal de
  # ruido de Villaviciosa (con 5 detecciones al azar la cobertura se movía
  # 0,047 y la accuracy de equipos 0,085). Con 20 ya desaparece; 20, 30 y
  # 50 dan cifras IDÉNTICAS, así que hay meseta y no filo. Se pone 50 por
  # margen: cuesta 0,6 s por partido. Ver docs/estabilizar_fit.md.
  n_init: 50

# ── Rechazo por distancia a AMBOS prototipos: MEDIDO Y DESCARTADO ────
#
# Idea: con solo dos cajones (A/B), un árbitro de amarillo o un
# entrenador en chándal caen forzosamente en el menos malo. Si el color
# está lejos de los dos, lo honesto sería decir "otro".
#
# No funciona con nuestra feature de color. Dos medidas:
#
#   - Umbral ABSOLUTO: calibrado en el benjamín parecía perfecto
#     (jugadores p90 0,656 vs staff p10 0,712, casi sin solape), pero
#     llevado a Villaviciosa hundía la accuracy de equipos de 0,718 a
#     0,482. Cada partido tiene su escala de color.
#   - Umbral RELATIVO a la separación entre prototipos (ya implementado,
#     que es la forma correcta de expresarlo): a 1,2 no cambia nada en
#     ninguno de los dos partidos; a 1,0 cuesta accuracy en Villaviciosa
#     (0,718 -> 0,682) y en el benjamín solo saca del campo a UNA
#     identidad que la regla de staff no cogiera ya.
#
# Conclusión: el amarillo del árbitro NO está lejos de los dos prototipos
# en un histograma HS de un torso de 15-40 px. Para separarlo hace falta
# comportamiento (pegado a banda, no sigue el juego), no color.
# Se deja implementado y en off: null = desactivado.
agregacion_dist_max_prototipo_nota: ver arriba

# ── Catálogo ABSOLUTO de equipaciones arbitrales ─────────────────────
#
# Los árbitros visten un conjunto CERRADO (amarillo/verde/naranja flúor,
# azul eléctrico, negro), así que se reconocen sin calibrar por partido —
# al revés que el intento anterior por distancia a los prototipos, que no
# viajaba entre partidos. Con regla de conflicto: si una equipación del
# partido cae en un arquetipo, ese arquetipo se desactiva solo.
#
# Validado en los dos cachés:
#   benjamín      -> desactiva 'naranja_fluor' (el equipo B viste naranja)
#                    y encuentra al árbitro: verde flúor, 493 obs, en el
#                    centro del campo (31, 24) m. Salía como equipo B.
#   Villaviciosa  -> 0 identidades marcadas: no roba ningún jugador.
#
# El arquetipo NEGRO está declarado pero inactivo: la feature de color es
# un histograma HS y sin V el negro no se distingue del blanco.
arbitro:
  # ⚠️ LIMITACIÓN CONOCIDA Y ACEPTADA (26-ago-2026): la exclusividad NO
  # se abstiene. Si en el tramo no hay árbitro, corona igualmente al mejor
  # candidato del tercer grupo. No es una regresión —ese candidato ya
  # estaba fuera del cómputo de equipos por estar en 'otro'— pero tampoco
  # es correcto, y al revés que la regla del portero, que sí sabe decir
  # "aquí no hay". Verificado en Villaviciosa: borrando al árbitro del
  # caché, corona a la identidad 39 (106 obs).
  uno_solo: true
  # ── margen_equipo: ADOPTADO el 26-ago-2026 (decisión de Alex) ──────
  #
  # El catálogo SOLO manda cuando el color de la identidad está a más de
  # `margen_equipo × d(A,B)` del prototipo más cercano. Sin esto, la regla
  # de conflicto protege al PROTOTIPO del equipo pero no a la dispersión
  # alrededor, y un jugador cuyo color se aparta cae en un arquetipo.
  #
  # Lo que desbloquea: **el árbitro sale por ELIMINACIÓN**. Dentro del
  # campo, quitando los dos equipos, los dos porteros y el staff, queda él
  # y nadie más. No hace falta ninguna señal de comportamiento — los cinco
  # medidos fallan (docs/arbitro.md).
  #
  # EL BARRIDO, en las dos patas (cuántas identidades quedan en el tercer
  # grupo; el objetivo es exactamente 1, el árbitro):
  #
  #   margen   benjamín              Villaviciosa
  #   0,55     2                     1  (el árbitro)
  #   0,60     2                     1
  #   0,62     1  (el árbitro)       1
  #   0,68     1  ← ADOPTADO         1
  #   0,75     1                     1
  #   0,78     0  ← SE PIERDE        1
  #   0,85     0                     1
  #
  # ⚠️ AVISO: en el BENJAMÍN la ventana es ESTRECHA — 0,62 a 0,75, con
  # acantilado en 0,78, donde el árbitro se pierde. Villaviciosa tiene
  # meseta ancha (0,55-0,85+). Se elige 0,68 porque es el CENTRO de la
  # zona común (0,62-0,75), no el valor que va justo. En otro campo esta
  # ventana puede caerse, y por eso hay una guarda:
  # `pipeline_equipos.avisar_tercer_grupo` avisa por el log si el tercer
  # grupo se queda vacío (el árbitro se coló en un equipo) o con dos o más
  # (el catálogo está robando jugadores).
  #
  # ⛔ REVERTIDO A 0 EL 26-ago-2026, HORAS DESPUÉS DE ADOPTARLO.
  #
  # La ventana no es solo estrecha: **se MUEVE con el detector**. Medido
  # sobre el MISMO partido con dos cachés distintos, contando las
  # detecciones que no son ninguna de las 14 personas y salen como
  # jugador:
  #
  #   caché              margen 0,00        margen 0,68
  #   benjamín v3        18 de 309 (5,8 %)  18 de 309 (5,8 %)
  #   benjamín v4        26 de 380 (6,8 %)  85 de 380 (22,4 %)  ← TRIPLICA
  #
  # Con el caché v4 el margen 0,68 deja fuera al ÁRBITRO (583
  # observaciones en el centro del campo) y se cuela entero en el equipo
  # B. El valor al que el árbitro sobrevive es 0,62-0,75 con el v3 y
  # ≤0,50 con el v4: **no hay ningún valor común**. Es el mismo patrón que
  # ya conocíamos con otros umbrales — los parámetros van pegados al
  # detector — pero aquí la consecuencia es que el parámetro no existe.
  #
  # Y hay una lección de método: la guarda de `avisar_tercer_grupo`
  # contaba 1 identidad en el tercer grupo y daba el visto bueno, porque
  # no puede saber si ESA 1 es el árbitro. Contar no basta cuando lo que
  # falla es la identidad de quien queda.
  #
  # Lo que sí queda: el árbitro sale por eliminación con margen 0 en las
  # tres patas, solo que acompañado de una segunda identidad. Y el bug
  # del id 40 de Villaviciosa sigue sin arreglar.
  margen_equipo: 0.0
  activo: true
  min_observaciones: 25
