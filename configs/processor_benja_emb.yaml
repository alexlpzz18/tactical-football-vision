# El v4 ajustado + puerta de re-entrada por EMBEDDING (siglip).
# Para la verificación visual de Alex: el color no puede ver dos
# compañeros de la misma equipación y el embedding sí (medido).
pipeline: nuevo
modo: desde_cache
deteccion:
  modelo: models/weights/best_v4.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 3
  tramo:
    min_ini: 5.0
    dur_seg: 60.0
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja_v4.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/tracking_benja/cache_detecciones_benja_v4.pkl
  cache_colores: data/tracking_benja/cache_colores_benja_v4.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/tracking_benja/posiciones_benja_emb.csv
  salida_meta: data/tracking_benja/posiciones_benja_emb_meta.json
  cache_embeddings: data/tracking_benja/emb_benja_siglip.pkl
