# Parámetros del tracking en metros (2 etapas), validados experimentalmente
# en Colab sobre el tramo min 5-6 (ver briefing_claude_code.md, Parte 2).
# NO cambiar sin medir contra el banco de evaluación (Tarea 3).

etapa_a:
  # Velocidad máxima plausible de un jugador (m/s). Define el radio de búsqueda:
  # RADIO = v_max * dt + margen
  v_max: 7.0
  # Margen de ruido de detección/proyección (metros)
  margen: 0.8
  # Regla anti-robo: si la 2ª mejor opción está a menos de este factor de
  # distancia extra (en radios), NO asociar (preferimos cortar el tracklet)
  ambig_factor: 0.7
  # Un track sin verse más de (max_gap_dts * dt) segundos se cierra
  max_gap_dts: 3.0
  # Filtro final: descartar tracklets con menos de estos frames
  min_frames: 3

# Contexto de plantilla (1/2): exclusión espacial dura — dos identidades
# co-ubicadas (mediana de distancia <= dist_max en sus frames comunes) son
# el mismo jugador y se fusionan (deduplicando por frame). No hace nada en
# el pipeline oficial (sin duplicados paralelos); en el candidato
# rescate+grafo: IDF1 0.225->0.287, IDSW 807->632, HOTA 0.147->0.165.
exclusion_espacial:
  activa: false  # sin efecto en el oficial; imprescindible con rescate
  dist_max: 1.5
  min_frames_comunes: 3

# Contexto de plantilla (2/2): cota BLANDA de plantilla — fusión golosa de
# identidades ENTRELAZADAS (observaciones alternadas en el tiempo,
# espacialmente compatibles por interpolación) hasta acercar la
# concurrencia de identidades activas a la plantilla real (~23). Blanda:
# se para cuando no quedan pares con coste <= coste_max.
cota_plantilla:
  activa: false  # solo tiene sentido sobre rescate+grafo+exclusion
  cota: 23
  coste_max: 4.0

# Tarea 3c: segunda pasada de cosido sobre las identidades ya cosidas
# (fusionadas en super-tracklets), para cerrar huecos largos. Tolerancia
# más conservadora que la 1ª pasada: con huecos de >6 s la extrapolación
# lineal es poco fiable, así que la tolerancia crece más despacio.
segunda_pasada:
  activa: false  # se decide tras medir contra el banco
  max_hueco: 12.0
  tol_base: 1.5
  tol_por_seg: 1.5
  peso_hueco: 0.3
  color_max_dist: 1.2
  peso_color: 0.15

# Tarea 3b: rescate de tracklets cortos. La Etapa A se corre con
# min_frames=1 (todo entra al cosido) y el filtro se aplica después a
# nivel de identidad: se conservan las que suman al menos
# min_frames_identidad observaciones en total.
rescate_cortos:
  activo: false  # se decide tras medir contra el banco
  min_frames_identidad: 3

# Tarea 3a: interpolación de huecos DENTRO de identidades cosidas.
# Solo entre dos posiciones reales (nunca extrapolar), solo en frames del
# caché, y solo si el hueco no supera max_hueco segundos.
interpolacion:
  # ADOPTADA con el modelo v4pre (08-ago-2026): cobertura 0.453→0.566 con
  # la tasa de IDSW bajando (0.339→0.320). Con v3 empeoraba la tasa
  # (0.341→0.356) y estuvo en off — ver docs/experimentos_tracking.md,
  # sección "salto v4pre". La aplican el banco y el processor DESPUÉS del
  # perfil (produce trayectorias, no identidades de tracklets).
  activa: true
  max_hueco: 6.0

# Consolidación FINAL (post-clasificación): fusiona fichas del MISMO
# equipo co-locadas de forma sostenida — los racimos que se ven en el
# replay. Se decide midiendo (concurrencia vs cobertura vs tasa IDSW);
# ver docs/experimentos_tracking.md.
# ADOPTADA (08-ago-2026): concurrencia 47→36 fichas por frame con la
# cobertura plana (0.566→0.557), IDF1 0.227→0.281, tasa de IDSW
# 0.320→0.304, accuracy de equipos 0.733→0.800 y quimeras 36→27.
# Va ANTES de interpolar (medido: después es peor, compara estelas
# fantasma). dist_max 6.0 es el borde del acantilado: a 7.0 la cobertura
# se desploma a 0.456 porque empieza a fusionar jugadores distintos.
consolidacion:
  activa: true
  dist_max: 6.0           # distancia mediana máxima entre las dos fichas (m)
  min_frames_comunes: 20  # "sostenida": no un cruce puntual

# Corte de TELETRANSPORTES (objetivo "replay creíble", 08-ago-2026):
# parte la identidad donde la velocidad es imposible de forma SOSTENIDA
# (cadenas quimera que saltan de un jugador a otro). Medido: 94 rachas de
# >8,5 m/s → 0, con la cobertura casi intacta (0.557 → 0.553) y sin coste
# de concurrencia (el corte parte en el tiempo, no añade fichas).
# El criterio es sostenido y no por paso suelto porque a dt=0,12 s el
# ruido del fondo (1,16 m de mediana) ya simula 9-10 m/s.
corte_velocidad:
  activo: true
  v_max: 8.5          # m/s (sprint de élite) — criterio de racha SOSTENIDA
  duracion_min: 0.5   # s que debe durar la racha imposible para cortar
  min_observaciones: 3  # trozos más cortos se descartan (parpadeo)
  # Criterio de SALTO INSTANTÁNEO (un solo frame): 60 m/s son 7,2 m en
  # 0,12 s, 3× el ruido de localización del fondo (p90 2,45 m ≈ 20 m/s).
  # Sin este criterio quedaban saltos de hasta 37 m en un frame (v_max
  # 309 m/s) que no formaban racha pero eran lo más visible del replay.
  v_teleport: 60.0

cosido:
  # Hueco temporal máximo entre el final de A y el inicio de B (segundos)
  max_hueco: 6.0
  # Tolerancia de distancia para coser: tol = tol_base + tol_por_seg * hueco
  tol_base: 1.2
  tol_por_seg: 3.0
  # Peso del término de hueco en el coste del candidato
  peso_hueco: 0.3
  # Veto suave de color: distancia de histogramas mayor que esto → no coser.
  # (El color en esta cámara es señal débil: mediana entre pares legítimos
  # = 0.90, p90 = 1.16.)
  color_max_dist: 1.2
  # Peso del término de color en el coste del candidato
  peso_color: 0.15
  # Selección de uniones: "goloso" (original validado) o "global"
  # (asignación de coste mínimo en grafo; Tarea 3, ver experimentos)
  metodo: goloso
  # Solo para metodo=global: coste de dejar un tracklet sin continuación
  # (> coste máximo de un candidato real, ~1.45)
  coste_no_union: 2.0
  # Consistencia de velocidad en la unión (Tarea 3, ver experimentos):
  # veto físico si la velocidad implicada por el salto supera v_max_salto
  # (null = off) y término de coste peso_vel * ||v_salto - vel_A|| / v_ref
  v_max_salto: null
  peso_vel: 0.0
  v_ref: 7.0

# ── BASE NUEVA: asociación con ByteTrack (perfil "bytetrack") ────────
#
# Adoptada el 11-ago-2026 tras el banco comparativo. Solo la usa el
# perfil "bytetrack"; los perfiles oficial y candidato siguen intactos.
#
# Medido en el tramo de validación (v4pre), con interpolación encima:
#
#   perfil       nIds  cob.   conc  IDF1   tasa   quimeras  equipos
#   candidato     244  0.551   34   0.259  0.301   23/43     0.661
#   bytetrack     142  0.558   23   0.443  0.147    5/40     0.714
#   (GT)           23  1.000   22
bytetrack:
  # Ver el docstring de ParametrosByteTrack: `umbral_emparejamiento` NO
  # es un IoU mínimo sino una distancia (1-IoU), así que 0.98 es MUY
  # permisivo. Con el 0.8 de la librería se perdía el 11 % de nuestras
  # detecciones, porque nuestros jugadores son diminutos (15-40 px) y el
  # IoU entre frames cae a plomo.
  umbral_activacion: 0.10
  buffer_perdido_s: 2.0
  umbral_emparejamiento: 0.98
  usar_fps_efectivo: true

# Cosido de los fragmentos de ByteTrack con criterio de PUREZA. Sin cota
# de plantilla, a propósito: el número de identidades es un proxy y la
# pureza es la métrica. Medido: quitar el veto de ambigüedad sube las
# quimeras de 5 a 11, y quitar el de color, de 5 a 9.
cosido_pureza:
  activo: true
  max_hueco: 4.0
  tol_base: 1.5
  tol_por_seg: 2.5
  v_max_salto: 8.0
  color_max_dist: 1.2
  peso_color: 0.5
  peso_hueco: 0.3
  margen_ambiguedad: 0.15
  solape_max_frames: 0
  max_pasadas: 3
