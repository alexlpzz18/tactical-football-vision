# Caché de BALÓN de la parte entera con el modelo REENTRENADO (balón pegado al pie).
#
# Es processor_benja_balon_parte_entera.yaml con DOS cambios y ninguno más, para que la
# comparación con producción (v1) sea en las mismas condiciones (plan: confianza 0,35,
# esquema mixto, misma franja, mismo muestreo):
#   - balon.modelo: el candidato (best.pt del reentreno, enlazado en Colab con este nombre)
#   - rutas.cache_balon: un caché PROPIO, para no pisar el de producción
# Medición: docs/plan_reentreno_balon.md y scripts/medir_reentreno_balon.py.
pipeline: nuevo
modo: full
deteccion:
  modelo: models/weights/best_v4pre.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 3
  tramo: null
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/tracking_benja/cache_detecciones_benja_p1.pkl
  cache_colores: data/tracking_benja/cache_colores_benja_p1.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/tracking_benja/posiciones_conjunto_p1.csv
  salida_meta: data/tracking_benja/posiciones_conjunto_p1_meta.json
  cache_balon: data/tracking_benja/cache_balon_p1_v2pegado.pkl # ← propio
balon:
  modelo: models/weights/best_balon_v2_pegado.pt # ← el candidato (best.pt)
  confianza: 0.35
  imgsz: 1280
  sample_every: 2
  esquema: mixto
  zona_min_m: 45.0
  margen_campo_m: 20.0
  altura_aerea_m: 3.0
  sahi:
    filas: 3
    columnas: 5
    solape: 0.15
checkpoint:
  cada_frames: 500
  reanudar: true
