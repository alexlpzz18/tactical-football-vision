# El v4 con SU caja de cambios (conf 0.45, buffer 1.5, minf 2, cosido
# hueco 4 / color 0.9). El juicio visual anterior fue sobre el v4 con los
# parámetros del v4pre, así que no valía: esto es para volver a mirar.
pipeline: nuevo
modo: desde_cache
deteccion:
  modelo: models/weights/best_v4.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 3
  tramo:
    min_ini: 5.0
    dur_seg: 60.0
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja_v4.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/tracking_benja/cache_detecciones_benja_v4.pkl
  cache_colores: data/tracking_benja/cache_colores_benja_v4.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/tracking_benja/posiciones_benja_v4_ajustado.csv
  salida_meta: data/tracking_benja/posiciones_benja_v4_ajustado_meta.json
