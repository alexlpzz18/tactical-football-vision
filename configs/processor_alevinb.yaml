# ════════════════════════════════════════════════════════════════════
# Procesador: Alevín B de Villaviciosa (F11), vídeo AlevinB_Dux.mp4
# ════════════════════════════════════════════════════════════════════
#
# Partido del MVP, solo preparación (docs/alevinb_preparacion.md). No es producción: las rutas no
# pisan nada del Villaviciosa de siempre ni del benjamín.
#
# Vídeo: 2560×1064 nativo, 25 fps, 1:35:00. MISMA cámara y posición que el cadete.
#
# ⚠️ Se procesa POR PARTES, una por fichero cortado (scripts/cortar_partido.py), que la celda
# scripts/colab_alevinb.py pone en `rutas.video`:
#   - en el descanso los equipos cambian de portería, y la regla de porteros deduce los lados POR
#     PASADA (`porteros.deducir_lados`);
#   - el fit de color es POR PASADA: la letra A/B de cada equipación puede cambiar entre partes. Se
#     casa por `colores_equipo` del meta, no por la letra.
#   - los frame_idx de la caché son los del CORTE, no los del vídeo entero.
# ────────────────────────────────────────────────────────────────────

pipeline: nuevo
modo: full # vídeo → cachés → CSV (Colab, GPU). En local: --modo desde_cache.

deteccion:
  chaleco_banda: null # la pista del árbitro es F7; en F11 está apagada por formato
  # El MISMO detector que el benjamín y que las cachés de Villaviciosa de producción (v4pre).
  modelo: models/weights/best_v4pre.pt
  confianza: 0.3
  max_area_caja: 0.05 # el público de la grada cercana sale grande: este filtro lo quita
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda

# Lente de la cámara de Villaviciosa (k1, k2 normalizados por el ancho: valen a 1920 y a 2560).
distorsion:
  k1: -1.5
  k2: 0.5

muestreo:
  sample_every: 3 # 25 fps → 8,33 Hz, como el Villaviciosa de producción
  tramo: null # cada parte es su propio fichero cortado

checkpoint:
  cada_frames: 500
  reanudar: true

tracking:
  perfil: bytetrack
config_tracking: configs/tracking.yaml # el de Villaviciosa

equipos:
  activo: true
  tope_cardinalidad:
    activo: false
    tope: 11
    tope_otro: 1
    lambda_holgura: 1.0
config_equipos: configs/team_classification_alevinb.yaml

campo_m:
  largo: 100.0 # los de configs/campo_alevinb.yaml (sin medir)
  ancho: 64.0
  margen: 8.0

exportacion:
  etiqueta_interpoladas: vecina_real

rutas:
  # Lo fija la celda por parte: data/raw/alevinb_p1.mp4 y data/raw/alevinb_p2.mp4
  video: data/raw/alevinb_p1.mp4
  cache: data/tracking_alevinb/cache_detecciones.pkl
  cache_colores: data/tracking_alevinb/cache_colores.pkl
  homografia: data/calibracion/homografia.npy
  salida_csv: data/tracking_alevinb/posiciones.csv
  salida_meta: data/tracking_alevinb/posiciones_meta.json
