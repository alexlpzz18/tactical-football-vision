# Cachés del v4 para el benjamín — MISMO tramo que su mini-GT (min 5-6).
#
# Tiene que ser este tramo y no otro: el mini-GT de equipos que etiquetó
# Alex está sobre estas 600 muestras, y es la única forma de comparar el
# v4 con el v4pre en el caso F7.

pipeline: nuevo
modo: full
deteccion:
  modelo: models/weights/best_v4.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 3
  tramo:
    min_ini: 5.0
    dur_seg: 60.0
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/tracking_benja/cache_detecciones_benja_v4.pkl
  cache_colores: data/tracking_benja/cache_colores_benja_v4.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/tracking_benja/posiciones_benja_v4.csv
  salida_meta: data/tracking_benja/posiciones_benja_v4_meta.json
