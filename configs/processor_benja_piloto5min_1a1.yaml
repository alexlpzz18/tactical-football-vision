# Ablación 1/3 contra 1/1 (docs/plan_ablacion_1a1.md) — SOLO PARA COLAB, no es producción.
#
# Idéntico a processor_benja_piloto5min.yaml (mismo detector, mismo SAHI, mismos filtros) salvo:
# - sample_every: 1  → los 8.991 frames del tramo, no 1 de cada 3;
# - tramo explícito: 5:00-10:00 de archivo (6:33-11:33 del reproductor), frames 8991-17981;
# - modo full y rutas propias en data/ablacion_1a1/, que en Colab es un ENLACE a Drive: así los
#   checkpoints sobreviven a una desconexión y `reanudar` los recoge.
# - checkpoint cada 1.000 frames: el caché de colores a 1/1 ronda los 350 MB y cada volcado lo
#   re-serializa entero (ver el aviso en processor_benja_parte_entera.yaml).
pipeline: nuevo
modo: full
deteccion:
  modelo: models/weights/best_v4pre.pt
  confianza: 0.3
  max_area_caja: 0.05
  sahi:
    filas: 2
    columnas: 4
    solape: 0.2
  device: cuda
distorsion:
  k1: 0.0
  k2: 0.0
muestreo:
  sample_every: 1
  tramo:
    min_ini: 5.0
    dur_seg: 300
checkpoint:
  cada_frames: 1000
  reanudar: true
tracking:
  perfil: bytetrack
config_tracking: configs/tracking_benja.yaml
equipos:
  activo: true
config_equipos: configs/team_classification_benja.yaml
campo_m:
  largo: 62.0
  ancho: 40.0
  margen: 5.0
rutas:
  video: data/raw/benja_gredos_p1_20min.mp4
  cache: data/ablacion_1a1/cache_detecciones_benja_piloto5min_1a1.pkl
  cache_colores: data/ablacion_1a1/cache_colores_benja_piloto5min_1a1.pkl
  homografia: data/calibracion_benja/homografia_benja.npy
  salida_csv: data/ablacion_1a1/posiciones_piloto5min_1a1.csv
  salida_meta: data/ablacion_1a1/posiciones_piloto5min_1a1_meta.json
