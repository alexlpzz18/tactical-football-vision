<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banco de pruebas · entorno</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:14px;top:14px;font:12px ui-monospace,monospace;
       color:#fff;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:4px;
       line-height:1.6;pointer-events:none}
  #err{position:fixed;inset:20px;font:12px ui-monospace,monospace;color:#ff9a9a;
       background:rgba(0,0,0,.9);padding:20px;white-space:pre-wrap;overflow:auto;display:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">cargando…</div>
<pre id="err"></pre>
<script src="core.js"></script>
<script src="env.js"></script>
<script>
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2', {antialias:true, alpha:false});
const hud = document.getElementById('hud');

function fatal(e){
  const el=document.getElementById('err');
  el.style.display='block'; el.textContent = (e&&e.stack)||String(e);
}

try{
  if(!gl) throw new Error('WebGL2 no disponible');
  const prog = programa(gl, ENV_VS, ENV_FS, 'env');
  const quad = bufferQuad(gl);
  const locPos = gl.getAttribLocation(prog, 'pos');

  let W=0,H=0;
  function medir(){
    const dpr = Math.min(devicePixelRatio||1, 2);
    W = Math.round(innerWidth*dpr); H = Math.round(innerHeight*dpr);
    cv.width=W; cv.height=H;
  }
  medir(); addEventListener('resize', medir);

  /* control: arrastrar para mirar, rueda para altura */
  let yaw = 0.6, pitch = 0.02, alt = 12;
  let drag=false, lx=0, ly=0;
  cv.addEventListener('pointerdown', e=>{drag=true;lx=e.clientX;ly=e.clientY;});
  addEventListener('pointerup', ()=>drag=false);
  addEventListener('pointermove', e=>{
    if(!drag) return;
    yaw -= (e.clientX-lx)*0.004; pitch = lim(pitch+(e.clientY-ly)*0.002,-0.35,0.6);
    lx=e.clientX; ly=e.clientY;
  });
  addEventListener('wheel', e=>{ alt = lim(alt*(1+Math.sign(e.deltaY)*0.12), 1.6, 600); }, {passive:true});

  /* ciclo de mundos cada 8 s en el banco, para revisarlos rápido */
  const DUR = 8000, TRANS = 2600;
  let t0 = performance.now();

  function uniformesMundo(m){
    gl.uniform3fv(prog.u.uSkyTop, m.skyTop);
    gl.uniform3fv(prog.u.uSkyHorizon, m.skyHorizon);
    gl.uniform3fv(prog.u.uSunDir, m.sunDir);
    gl.uniform3fv(prog.u.uSunCol, m.sunCol);
    gl.uniform1f(prog.u.uSunSize, m.sunSize);
    gl.uniform1f(prog.u.uSunPower, m.sunPower);
    gl.uniform3fv(prog.u.uHaze, m.haze);
    gl.uniform1f(prog.u.uStars, m.stars);
    gl.uniform1f(prog.u.uExposure, m.exposure);
    gl.uniform1f(prog.u.uCloud, m.cloud);
    gl.uniform1f(prog.u.uCloudHeight, m.cloudHeight);
    gl.uniform3fv(prog.u.uCloudCol, m.cloudCol);
    const rc=[],rb=[],ra=[],rf=[],rh=[],rs=[];
    m.ridge.forEach(r=>{ rc.push(...r.col); rb.push(r.base); ra.push(r.amp);
                         rf.push(r.freq); rh.push(r.haze); rs.push(r.seed); });
    gl.uniform3fv(prog.u.uRidgeCol, rc);
    gl.uniform1fv(prog.u.uRidgeBase, rb); gl.uniform1fv(prog.u.uRidgeAmp, ra);
    gl.uniform1fv(prog.u.uRidgeFreq, rf); gl.uniform1fv(prog.u.uRidgeHaze, rh);
    gl.uniform1fv(prog.u.uRidgeSeed, rs);
    gl.uniform1f(prog.u.uWater, m.water);
    gl.uniform1f(prog.u.uWaterAz, m.waterAz);
    gl.uniform1f(prog.u.uWaterWide, m.waterWide);
    gl.uniform3fv(prog.u.uWaterCol, m.waterCol);
  }

  let fps=0, fc=0, ft=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const el = now - t0;
    const ciclo = Math.floor(el / DUR) % MUNDOS.length;
    const dentro = el % DUR;
    const sig = (ciclo+1) % MUNDOS.length;
    const t = dentro > DUR-TRANS ? easeIO((dentro-(DUR-TRANS))/TRANS) : 0;
    const m = mezclarMundos(MUNDOS[ciclo], MUNDOS[sig], t);

    gl.viewport(0,0,W,H);
    const ojo=[0, alt, 0];
    const dir=[Math.cos(yaw)*Math.cos(pitch), Math.sin(pitch), Math.sin(yaw)*Math.cos(pitch)];
    const view = M4.mirar(ojo, [ojo[0]+dir[0], ojo[1]+dir[1], ojo[2]+dir[2]], [0,1,0]);
    const proj = M4.perspectiva(50*Math.PI/180, W/H, 0.1, 8000);
    const inv  = M4.invertir(M4.mul(proj, view));

    gl.useProgram(prog);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(locPos);
    gl.vertexAttribPointer(locPos, 2, gl.FLOAT, false, 0, 0);
    gl.uniformMatrix4fv(prog.u.uInvViewProj, false, inv);
    gl.uniform3fv(prog.u.uCamPos, ojo);
    gl.uniform1f(prog.u.uTime, now*0.001);
    uniformesMundo(m);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    fc++;
    if(now-ft>500){ fps=Math.round(fc*1000/(now-ft)); fc=0; ft=now; }
    hud.textContent =
      `${MUNDOS[ciclo].nombre} → ${MUNDOS[sig].nombre}  t=${t.toFixed(2)}\n`+
      `${MUNDOS[ciclo].pie}\n`+
      `alt ${alt.toFixed(1)} m · yaw ${yaw.toFixed(2)} · ${fps} fps\n`+
      `arrastra = mirar · rueda = altura`;
  }
  requestAnimationFrame(frame);
}catch(e){ fatal(e); }
</script>
</body></html>
